<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summon Electronics | Instant PCB Quotes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    color: #1a1a1a; background: #ffffff; line-height: 1.6;
  }

  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* Hero Section */
  .hero { padding: 120px 0 80px; text-align: center; }
  .hero h1 { 
    font-size: 64px; font-weight: 700; margin-bottom: 24px; letter-spacing: -0.02em;
  }
  .hero .highlight-orange { color: #ff6a00; } /* Orange like "Get in Touch" */
  .hero .highlight-blue { color: #00a8ff; } /* Blue like "From Chaos to Control" */
  .hero p { font-size: 20px; color: #666; max-width: 640px; margin: 0 auto 40px; line-height: 1.6; }

  .cta-group { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .btn {
    padding: 14px 32px; border-radius: 8px; font-size: 16px; font-weight: 600;
    cursor: pointer; border: none; transition: all 0.2s;
  }
  .btn-primary {
    background: #ff6a00; color: white;
  }
  .btn-primary:hover {
    background: #e65c00;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255,106,0,0.3);
  }

  /* Popup Modal */
  #formModal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); justify-content: center; align-items: center;
    z-index: 1000; animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .form-content {
    background: #fff; border-radius: 12px; width: 90%; max-width: 800px;
    height: 90vh; max-height: 95vh;
    padding: 24px; position: relative; overflow-y: auto;
    animation: zoomIn 0.3s ease;
  }
  @keyframes zoomIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .close-btn {
    position: absolute; top: 10px; right: 16px; font-size: 24px;
    cursor: pointer; color: #666;
  }

  iframe {
    width: 100%; height: 85vh; border: none; border-radius: 8px;
  }

  @media (max-width: 768px) {
    .hero h1 { font-size: 42px; line-height: 1.3; }
    .hero p { font-size: 18px; }
    .form-content { width: 95%; height: 95vh; padding: 16px; }
  }
</style>
</head>
<body>

<!-- Hero Section -->
<section class="hero">
  <div class="container">
    <h1><span class="highlight-orange">Get your PCB assembly quote</span> <span class="highlight-blue">in minutes,<br>not days</span></h1>
    <p>Upload your BOM. Get instant parts pricing, assembly cost estimates, and coverage insights—no back-and-forth emails required.</p>
    <div class="cta-group">
      <button onclick="openForm()" class="btn btn-primary">Upload BOM & Get Quote</button>
    </div>
  </div>
</section>

<!-- Popup Zoho Form -->
<div id="formModal">
  <div class="form-content">
    <span class="close-btn" onclick="closeForm()">&times;</span>
    <iframe aria-label='Upload BOM and Get Quote'
      src='https://forms.zohopublic.com/summonelectronics/form/CustomerSatisfactionForm/formperma/VXlhO_SNgzc20I4aVQ1uG7CUFy9av4VRNV3mKyJh3FI'>
    </iframe>
  </div>
</div>

<script>
function openForm() {
  const modal = document.getElementById('formModal');
  modal.style.display = 'flex';

  // Scroll smoothly to popup center (works mobile + desktop)
  setTimeout(() => {
    modal.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 150);
}

function closeForm() {
  document.getElementById('formModal').style.display = 'none';
}
</script>

</body>
</html>
