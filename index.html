<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summon Electronics | Instant PCB Quotes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    color: #1a1a1a; 
    background: #ffffff; 
    line-height: 1.6;
    overflow-x: hidden;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  
  /* Hero Section with Background Elements */
  .hero { 
    padding: 100px 0 80px; 
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  
  /* Animated Background Gradient */
  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 50%, rgba(0, 168, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 70% 50%, rgba(255, 106, 0, 0.08) 0%, transparent 50%);
    animation: gradientShift 15s ease infinite;
    z-index: 0;
  }
  
  @keyframes gradientShift {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(-5%, -5%) rotate(5deg); }
  }
  
  /* Floating Decorative Elements */
  .hero::after {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(0, 168, 255, 0.1), rgba(255, 106, 0, 0.1));
    top: -200px;
    right: -200px;
    z-index: 0;
    animation: float 20s ease-in-out infinite;
  }
  
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(30px) rotate(180deg); }
  }
  
  .hero-content {
    position: relative;
    z-index: 1;
  }
  
  /* Eyebrow Label */
  .hero .eyebrow {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #ff6a00;
    margin-bottom: 24px;
    padding: 8px 20px;
    background: rgba(255, 106, 0, 0.1);
    border-radius: 30px;
    animation: fadeInDown 0.8s ease;
  }
  
  @keyframes fadeInDown {
    from {
      opacity: 0;
      transform: translateY(-20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  /* Main Heading */
  .hero h1 { 
    font-size: 56px; 
    font-weight: 800; 
    margin-bottom: 28px; 
    letter-spacing: -0.02em;
    line-height: 1.15;
    animation: fadeInUp 1s ease;
  }
  
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  .hero .highlight-orange { 
    background: linear-gradient(135deg, #ff6a00 0%, #ff8c42 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: inline-block;
  }
  
  .hero .highlight-blue { 
    background: linear-gradient(135deg, #00a8ff 0%, #0088cc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: inline-block;
  }
  
  /* Description Text */
  .hero p { 
    font-size: 18px; 
    color: #555; 
    max-width: 680px; 
    margin: 0 auto 48px; 
    line-height: 1.7;
    font-weight: 400;
    animation: fadeIn 1.2s ease;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  /* CTA Button Group */
  .cta-group { 
    display: flex; 
    gap: 20px; 
    justify-content: center; 
    flex-wrap: wrap;
    animation: fadeInUp 1.4s ease;
  }
  
  .btn {
    padding: 16px 40px; 
    border-radius: 12px; 
    font-size: 16px; 
    font-weight: 600;
    cursor: pointer; 
    border: none; 
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  
  /* Primary Button with Gradient */
  .btn-primary {
    background: linear-gradient(135deg, #ff6a00 0%, #ff8c42 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(255, 106, 0, 0.3);
  }
  
  .btn-primary::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s;
  }
  
  .btn-primary:hover::before {
    left: 100%;
  }
  
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(255, 106, 0, 0.4);
  }
  
  .btn-primary:active {
    transform: translateY(-1px);
  }
  

  /* Popup Modal */
  #formModal {
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%;
    background: rgba(0, 0, 0, 0.7); 
    justify-content: center; 
    align-items: center;
    z-index: 1000; 
    animation: fadeIn 0.3s ease;
    backdrop-filter: blur(4px);
  }
  
  .form-content {
    background: #fff; 
    border-radius: 20px; 
    width: 90%; 
    max-width: 800px;
    height: 90vh; 
    max-height: 95vh;
    padding: 32px; 
    position: relative; 
    overflow-y: auto;
    animation: zoomIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  }
  
  @keyframes zoomIn {
    from { 
      transform: scale(0.9); 
      opacity: 0; 
    }
    to { 
      transform: scale(1); 
      opacity: 1; 
    }
  }
  
  .close-btn {
    position: absolute; 
    top: 16px; 
    right: 20px; 
    font-size: 28px;
    cursor: pointer; 
    color: #666;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.2s;
    z-index: 10;
  }
  
  .close-btn:hover {
    background: rgba(255, 106, 0, 0.1);
    color: #ff6a00;
    transform: rotate(90deg);
  }
  
  iframe {
    width: 100%; 
    height: calc(90vh - 64px); 
    border: none; 
    border-radius: 12px;
  }
  
  /* Responsive Design */
  @media (max-width: 768px) {
    .hero { 
      padding: 60px 0 50px; 
    }
    .hero h1 { 
      font-size: 36px; 
      line-height: 1.2; 
      margin-bottom: 20px;
    }
    .hero p { 
      font-size: 16px; 
      margin-bottom: 36px;
    }
    .btn {
      padding: 14px 32px;
      font-size: 15px;
    }
    .form-content { 
      width: 95%; 
      height: 95vh; 
      padding: 20px; 
    }
  }
  
  @media (max-width: 480px) {
    .hero h1 {
      font-size: 28px;
    }
    .hero .eyebrow {
      font-size: 11px;
      padding: 6px 16px;
    }
  }
</style>
</head>
<body>
<!-- Hero Section -->
<section class="hero">
  <div class="hero-content">
    <div class="container">
      <div class="eyebrow">INSTANT PCB QUOTES</div>
      <h1>
        <span class="highlight-orange">Get your PCB assembly quote</span><br>
        <span class="highlight-blue">in minutes, not days</span>
      </h1>
      <p>Upload your BOM. Get instant parts pricing, assembly cost estimates, and coverage insights—no back-and-forth emails required.</p>
      <div class="cta-group">
        <button onclick="openForm()" class="btn btn-primary">Upload BOM & Get Quote</button>
      </div>
    </div>
  </div>
</section>

<!-- Popup Zoho Form -->
<div id="formModal">
  <div class="form-content">
    <span class="close-btn" onclick="closeForm()">&times;</span>
    <iframe aria-label='Upload BOM and Get Quote'
      src='https://forms.zohopublic.com/summonelectronics/form/CustomerSatisfactionForm/formperma/VXlhO_SNgzc20I4aVQ1uG7CUFy9av4VRNV3mKyJh3FI'>
    </iframe>
  </div>
</div>

<script>
function openForm() {
  const modal = document.getElementById('formModal');
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden'; // Prevent background scroll
  setTimeout(() => {
    modal.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 150);
}

function closeForm() {
  const modal = document.getElementById('formModal');
  modal.style.display = 'none';
  document.body.style.overflow = ''; // Restore scroll
}

// Close modal on ESC key
document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') {
    closeForm();
  }
});

// Close modal on background click
document.getElementById('formModal').addEventListener('click', function(event) {
  if (event.target === this) {
    closeForm();
  }
});
</script>
</body>
</html>
