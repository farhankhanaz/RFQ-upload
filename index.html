<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Webhook Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    button {
      background: #4F46E5;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 0;
      width: 100%;
    }
    button:hover { background: #3730a3; }
    #output {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>🧪 Simple Webhook Test</h1>
  
  <p><strong>Webhook URL:</strong><br>
  <small>https://flow.zoho.com/718576821/flow/webhook/incoming?zapikey=1001.107204331c6c2e73a203830ac3bcbb3d...</small></p>

  <button onclick="test1()">Test 1: Minimal Data (no CORS)</button>
  <button onclick="test2()">Test 2: With mode: 'cors'</button>
  <button onclick="test3()">Test 3: With no-cors (old way)</button>

  <div id="output"></div>

  <script>
    const webhookUrl = 'https://flow.zoho.com/718576821/flow/webhook/incoming?zapikey=1001.107204331c6c2e73a203830ac3bcbb3d.87c000471c8bb0ec0d2756a5067c16d6&isdebug=false';
    const output = document.getElementById('output');

    async function test1() {
      output.textContent = 'Test 1: Sending minimal data without mode setting...\n';
      
      const data = {
        test: 'test1',
        name: 'Farhan',
        email: 'test@example.com',
        timestamp: new Date().toISOString()
      };

      try {
        const response = await fetch(webhookUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data)
        });

        output.textContent += `✓ Request sent\n`;
        output.textContent += `Response status: ${response.status}\n`;
        output.textContent += `Response OK: ${response.ok}\n`;
        output.textContent += `\nData sent:\n${JSON.stringify(data, null, 2)}\n`;
        output.textContent += `\nCheck Zoho Flow now!`;
      } catch (error) {
        output.textContent += `Error: ${error.message}\n`;
        output.textContent += `\nThis might be CORS, but check Zoho Flow anyway!`;
      }
    }

    async function test2() {
      output.textContent = 'Test 2: Sending with mode: cors...\n';
      
      const data = {
        test: 'test2',
        name: 'Farhan',
        email: 'test@example.com',
        timestamp: new Date().toISOString()
      };

      try {
        const response = await fetch(webhookUrl, {
          method: 'POST',
          mode: 'cors',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data)
        });

        output.textContent += `✓ Request sent\n`;
        output.textContent += `Response status: ${response.status}\n`;
        output.textContent += `\nData sent:\n${JSON.stringify(data, null, 2)}\n`;
        output.textContent += `\nCheck Zoho Flow now!`;
      } catch (error) {
        output.textContent += `Error: ${error.message}\n`;
        output.textContent += `\nCheck Zoho Flow anyway - data might have been sent!`;
      }
    }

    async function test3() {
      output.textContent = 'Test 3: Sending with mode: no-cors (old way)...\n';
      
      const data = {
        test: 'test3',
        name: 'Farhan',
        email: 'test@example.com',
        timestamp: new Date().toISOString()
      };

      try {
        const response = await fetch(webhookUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data)
        });

        output.textContent += `✓ Request sent\n`;
        output.textContent += `Response type: ${response.type}\n`;
        output.textContent += `\nData sent:\n${JSON.stringify(data, null, 2)}\n`;
        output.textContent += `\nCheck Zoho Flow now!`;
      } catch (error) {
        output.textContent += `Error: ${error.message}\n`;
      }
    }
  </script>
</body>
</html>
